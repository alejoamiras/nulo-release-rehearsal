name: paths-filter-test
on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: f
        with:
          # Mirrors the real-repo bug: a bare `!` negation under the default
          # `predicate-quantifier: some` matches every file that ISN'T that path.
          filters: |
            buggy_with_negation:
              - 'src/**'
              - '!src/**/*.md'
            fixed_no_negation:
              - 'src/**'
            control_no_negation:
              - 'docs/**'
      - name: Results
        run: |
          {
            echo "## paths-filter results"
            echo "| filter | matched |"
            echo "|---|---|"
            echo "| buggy_with_negation (\`src/**\` + \`!src/**/*.md\`) | ${{ steps.f.outputs.buggy_with_negation }} |"
            echo "| fixed_no_negation (\`src/**\`) | ${{ steps.f.outputs.fixed_no_negation }} |"
            echo "| control_no_negation (\`docs/**\`) | ${{ steps.f.outputs.control_no_negation }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
